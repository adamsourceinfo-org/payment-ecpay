service: payment-ecpay
health_path: /health
# 綠界的回呼（ReturnURL / PeriodReturnURL / PaymentInfoURL）必須打得到，
# 所以服務對公網開放。這表示應用層的 API key 是唯一一道門 ——
# key 存 hash、可停用、有稽核欄位；回呼端點則靠 CheckMacValue 驗真偽。
allow_unauthenticated: true

# 一個環境一台 apps-pg，服務靠 database 分隔。instance 由平台決定，
# 這裡只宣告自己的 database 與執行身分；連線字串由 CI 依部署目標推導。
# 隔離來自 payment_ecpay 這個 database 的 REVOKE CONNECT FROM PUBLIC
# 加上只授權給 run-payment-ecpay，不是靠 IAM。
runtime_sa: run-payment-ecpay
db:
  name: payment_ecpay
